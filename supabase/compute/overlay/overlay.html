<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suparade overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: min(760px, 92vw); }
  .alert { display: flex; gap: 20px; align-items: center; padding: 18px 24px; border-radius: 20px; color: #fff;
    background: linear-gradient(135deg, rgba(17, 24, 39, .94), rgba(31, 41, 55, .94));
    border: 2px solid #f97316; box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
    animation: pop-in .55s cubic-bezier(.2, .9, .3, 1.25) both; }
  .alert.out { animation: pop-out .45s ease-in both; }
  .amount { font-size: 46px; font-weight: 800; letter-spacing: -.02em; color: #fdba74; white-space: nowrap; }
  .headline { font-size: 18px; font-weight: 700; opacity: .9; }
  .message { font-size: 23px; font-weight: 600; line-height: 1.25; margin-top: 4px; }
  .by { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin-top: 6px; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes pop-out { to { opacity: 0; transform: translateY(24px); } }
  #status { display: none; position: fixed; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #fff; background: rgba(0, 0, 0, .65); }
  body.debug #status { display: block; }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="status">starting</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/*__ALERTS__*/

const CONFIG = /*__CONFIG__*/null;
const params = new URLSearchParams(location.search);
const campaignId = params.get("campaign") || CONFIG.campaignId || "";
const brand = params.get("brand") || CONFIG.brand;
const holdMs = Number(params.get("hold")) || 8000;
if (params.has("debug")) document.body.classList.add("debug");

const stage = document.getElementById("stage");
const status = (text) => { document.getElementById("status").textContent = text; };
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const queue = [];
const shown = new Set();
let busy = false;

function render(view) {
  const card = document.createElement("div");
  card.className = "alert";
  const amount = document.createElement("div");
  amount.className = "amount";
  amount.textContent = view.amount;
  const text = document.createElement("div");
  for (const [cls, value] of [["headline", view.headline], ["message", view.message], ["by", "Suparade · paid by an AI agent"]]) {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = value;
    text.append(line);
  }
  card.append(amount, text);
  return card;
}

async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const card = render(queue.shift());
  stage.replaceChildren(card);
  await sleep(holdMs);
  card.classList.add("out");
  await sleep(450);
  card.remove();
  busy = false;
  next();
}

function announce(view) {
  queue.push(view);
  next();
}

if (params.has("test")) {
  announce(alertView({ amount_cents: 500, currency: "usd", message: "Test alert: the overlay is connected." }, "your stream", brand));
}

if (!CONFIG.supabaseUrl || !CONFIG.anonKey) {
  status("not configured: no Supabase URL or anon key");
} else {
  const supabase = createClient(CONFIG.supabaseUrl, CONFIG.anonKey);
  const names = new Map();
  const creatorName = async (id) => {
    if (!names.has(id)) {
      const { data } = await supabase.from("creators").select("display_name").eq("id", id).maybeSingle();
      names.set(id, data?.display_name || "");
    }
    return names.get(id);
  };
  const filter = campaignId ? { filter: `campaign_id=eq.${campaignId}` } : {};
  supabase
    .channel("suparade-overlay")
    .on("postgres_changes", { event: "*", schema: "public", table: "tips", ...filter }, async (payload) => {
      const tip = paidTip(payload, campaignId, shown);
      if (!tip) return;
      shown.add(tip.id);
      announce(alertView(tip, await creatorName(tip.creator_id), brand));
    })
    .subscribe((state) => status(`realtime ${state}${campaignId ? ` · campaign ${campaignId.slice(0, 8)}` : ""}`));
}
</script>
</body>
</html>
